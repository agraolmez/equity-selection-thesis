[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-bot-thesis"
version = "1.0.0"
description = "Final V6 machine-learning long/short portfolio thesis"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Ağra Emir Ölmez"}]
requires-python = ">=3.11"
keywords = ["asset-pricing", "machine-learning", "portfolio-optimization", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas==2.2.3",
  "pyarrow==19.0.0",
  "duckdb==1.3.2",
  "numpy==2.1.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "threadpoolctl==3.5.0",
  "statsmodels==0.14.4",
  "skglm==0.5",
  "numba==0.67.0",
  "llvmlite==0.44.0",
  "xgboost==3.2.0",
  "torch==2.7.1",
  "cvxpy==1.9.2",
  "cvxpylayers==1.2.0",
  "clarabel==0.11.1",
  "scs==3.2.11",
  "diffcp==1.1.9",
  "requests==2.32.4",
]

[project.optional-dependencies]
research = [
  "pytest==8.3.4",
  "matplotlib==3.10.0",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "nbconvert==7.16.6",
  "python-docx==1.2.0",
]
live = [
  "lseg-data>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers"
