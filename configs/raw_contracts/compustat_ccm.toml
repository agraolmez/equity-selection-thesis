key_columns = ["gvkey", "LIID", "LINKPRIM", "LINKTYPE", "LPERMNO", "LINKDT", "LINKENDDT"]
grain = "gvkey_security_link_interval; overlapping candidates require later deterministic resolution"
required_columns = ["gvkey", "LIID", "LINKPRIM", "LINKTYPE", "LPERMNO", "LPERMCO", "LINKDT", "LINKENDDT", "cusip", "cik", "FIC", "LOC", "INCORP"]

