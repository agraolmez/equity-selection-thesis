future_restatement_may_rewrite_past_fundamentals = false

[preprocessing]
cross_section = "signal-date long-eligible scoring universe"
continuous_winsor_lower_quantile = "0.01"
continuous_winsor_upper_quantile = "0.99"
quantile_algorithm = "Hyndman-Fan type 7 linear interpolation over finite nonmissing values"
rank_ties = "average"
centered_rank_formula = "((average_rank - 0.5) / N_nonmissing) - 0.5"
rank_range = "[-0.5,+0.5]"
missing_continuous_fill_after_ranking = "0"
dedicated_missing_indicator_for_every_continuous = true
binary_values = [0, 1]
nullable_binary_encoding = "missing => value 0 and is_missing 1; genuine zero => value 0 and is_missing 0"
categorical_encoding = "full one-hot with explicit UNKNOWN and no dropped reference category"
aggregate_zscore_history = "signal months strictly before current signal"
aggregate_zscore_standard_deviation = "sample ddof=1"
aggregate_zscore_min_prior_nonmissing = 2
aggregate_zscore_clip = "[-5,+5]"
aggregate_missing_fill = "0 with dedicated missingness indicator"
raw_identifiers_ticker_names_and_future_availability_indicators_are_features = false

[labels.beta_label]
lookback_sessions = 252
minimum_valid_observations = 126
eligible_return_legs = "return_history_usable==true and covered_trading_sessions==1"
factors = ["mktrf", "smb", "hml", "rmw", "cma", "umd"]
dependent_variable = "authoritative_total_return-rf"
intercept = true
half_life_sessions = 126
weight_formula = "2^(-age_sessions/126)"
slope_clip_cross_section = "signal-date long-eligible scoring universe"
slope_clip_quantiles = ["0.01", "0.99"]
slope_clip_algorithm = "Hyndman-Fan type 7"
intercept_is_subtracted_from_forward_label = false

[labels.forward_interval]
clock_source = "verified rebalance_calendar"
signal_timestamp = "after signal_date close"
entry = "first verified trading-day close after signal"
included_return_span = "strictly after entry close through and including next rebalance close"
signal_to_entry_return_credited = false
multi_session_return_use = "label missing; a compounded multi-session security return is not a daily residual and is never approximated by subtracting summed daily factors"
valid_forward_return_legs = "return_history_usable==true and covered_trading_sessions==1; ordinary_plus_terminal_delisting_adjustment is valid only when it is one session"
span_straddling_entry_or_exit = "label missing; never prorate"
unresolved_or_nonusable_gap = "label missing; never zero"
midperiod_delisting = "end security path at reconciled liquidation payoff; subsequent cash contributes zero excess return"
security_label_available_date = "max(exit_date, all contributing outcome_availability_date)"
month_label_available_date = "max(security_label_available_date across all valid labels in the signal-date scoring cross-section)"
training_cutoff = "month_label_available_date<=fit_signal_date"

[labels.primary]
name = "residual_return_rank"
unranked_formula = "sum over one-session legs after entry through exit of (authoritative_total_return - same-session rf - clipped_beta_label' * same-session FF5+UMD); the regression intercept is not subtracted"
rank_cross_section = "signal-date long-eligible securities with valid realized outcomes"
rank_formula = "((average_rank - 0.5) / N_valid) - 0.5"
rank_ties = "average"
minimum_valid_labels_per_signal = 100
required_monthly_mean = "exact_zero"

[labels.robustness_excess]
name = "excess_return_rank"
unranked_formula = "sum(authoritative_total_return - sum(rf over return leg span))"
rank_cross_section = "identical to primary"
rank_formula = "identical to primary"

[labels.robustness_magnitude]
name = "residual_return_mad_standardized"
formula = "(unranked_residual_return - within_month_median) / (1.4826 * within_month_MAD)"
clip = "[-5,+5]"
zero_mad = "target missing for the entire signal month"

[splits]
stage_axis = "holding_month"
chronological = true
expanding = true
purge_unit = "one complete holding interval"
training_label_requires_month_availability_by_fit_signal = true
interval_crossing_training_to_evaluation_boundary_is_training_eligible = false
