closed_file_sets_required = true

[publication]
content_addressed_build_id_required = true
dependency_scoped_code_hashes_required = true
pointer_replaced_last = true
primary_pointer_authorizes_independent_verification_only = true
primary_pointer_authorizes_stage11 = false
independent_verification_required = true
verified_pointer_may_authorize_stage11_validation_only = true
verified_pointer_may_authorize_stage12_or_later = false
