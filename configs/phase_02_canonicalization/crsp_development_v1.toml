[outputs.schemas.primary_pointer]
format = "canonical_json_object"
top_level_keys = ["artifact_path", "build_id", "calendar_build_id", "contract_id", "manifest_sha256", "schema_version", "status"]
top_level_types = ["project_root_relative_posix_path", "string", "string", "string", "sha256", "int64", "string"]

[outputs.schemas.differences]
columns = ["check_id", "category", "expected", "actual", "evidence", "message"]
logical_types = ["string", "string", "canonical_json_value", "canonical_json_value", "string", "string"]
row_policy = "Header plus failing independent-verification checks only, ordered by check_id; a pass has exactly the header and zero data rows."

[outputs.schemas.independent_check]
format = "canonical_json_object"
top_level_keys = ["build_id", "checks", "contract_id", "independence", "primary_manifest_sha256", "profile_name", "schema_version", "status", "summary", "verification_id", "verifier_implementation_sha256"]
top_level_types = ["string", "array", "string", "object", "sha256", "string", "int64", "string", "object", "string", "sha256"]
check_entry_keys = ["actual", "category", "check_id", "evidence", "expected", "message", "status"]
check_entry_types = ["json_value", "string", "string", "string", "json_value", "string", "PASS_or_FAIL"]
check_order = "ascending unique check_id"
summary_keys = ["check_count", "daily_full_file_rows_read", "daily_retained_rows", "difference_count", "fail_count", "monthly_full_file_rows_read", "monthly_retained_rows", "pass_count"]
summary_types = ["int64", "int64", "int64", "int64", "int64", "int64", "int64", "int64"]
independence_keys = ["full_raw_hashes_recomputed", "grouping_depends_on_input_sort", "primary_builder_imported", "raw_files_reread"]
independence_types = ["bool", "bool", "bool", "int64"]

[outputs.schemas.verified_pointer]
format = "canonical_json_object"
top_level_keys = ["build_id", "contract_id", "differences_sha256", "independent_check_sha256", "primary_manifest_sha256", "schema_version", "status", "verification_id", "verification_path"]
top_level_types = ["string", "string", "sha256", "sha256", "sha256", "int64", "string", "string", "project_root_relative_posix_path"]

[outputs.closed_sets]
artifact_build_files = ["manifest.json", "output_hashes.sha256"]
verification_files = ["differences.csv", "independent_check.json"]
quality_inventory_members = [
  "_SUCCESS.json", "canonicalization_rules.json", "checks.csv",
  "duplicate_column_differences.csv", "duplicate_multiplicity.csv",
  "duplicate_summary.csv", "flag_domains.csv", "input_receipt.json", "summary.json",
]
run_receipts_are_outside_immutable_quality_and_artifact_sets = true
timestamps_elapsed_seconds_and_machine_metadata_are_run_receipt_only = true

[verification]
standalone_verifier_required = true
verifier_may_import_primary_builder = false
independent_full_raw_reread_required = true
independent_raw_hash_required = true
independent_grouping_must_not_depend_on_input_sort = true
all_output_hashes_must_match = true
exact_output_schemas_required = true
closed_directory_file_sets_required = true
zero_differences_required = true
failed_verification_may_replace_verified_pointer = false
