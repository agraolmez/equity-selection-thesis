schema_version = 1
profile_name = "crsp_development_supporting_source_structure"
profile_version = "v1"
status = "locked_after_aggregate_discovery_before_primary_profile"
purpose = "Prove development-relevant CRSP historical-identity, shares, event-ledger, and current-header structure before unit joins or canonical market publication."

[scope]
start_date = "2000-01-01"
end_date = "2014-12-31"
date_bounds_are_inclusive = true
names_and_shares_rule = "retain an interval iff end_date >= scope_start and start_date <= scope_end"
distribution_rule = "retain iff DisExDt is inside the inclusive scope"
delisting_rule = "retain iff DelistingDt or DelDlyDt is inside the inclusive scope"
stock_header_rule = "full-file exact header and PERMNO key QA only; all current descriptor payload is prohibited"
date_first_gating_required = true
excluded_row_non_date_payload_may_be_inspected = false
whole_file_byte_hash_and_row_count_are_the_only_exceptions = true
december_2014_stage = "embargo_quality_and_reconciliation_only"
canonical_tables_materialized = false
numeric_units_validated = false
returns_reconciled = false
eligibility_built = false
targets_built = false
features_built = false
portfolios_built = false
pnl_built = false
performance_analyzed = false
raw_security_keys_may_be_published = false

