required_status = "verified_passed"

[key_semantics]
permno_format = "one or more ASCII decimal digits representing a positive signed-int64 value"
sequence_format = "one or more ASCII decimal digits representing a positive signed-int64 value"
date_format = "strict Gregorian YYYY-MM-DD"
blank_or_invalid_scope_gate_date_is_fatal_globally = true
blank_or_invalid_required_date_is_fatal_in_retained_rows = true
blank_invalid_or_nonpositive_permno_is_fatal_in_retained_rows = true
blank_invalid_or_nonpositive_distribution_sequence_is_fatal_in_retained_rows = true
intervals_are_inclusive = true
inverted_interval_is_fatal = true

[duplicate_policy]
global_key_profile_required = true
full_decoded_row_comparison_required = true
classify_exact_and_conflicting_duplicates = true
conflicting_duplicates_are_fatal = true
exact_duplicates_are_fatal_for_these_sources = true
blind_drop_duplicates_prohibited = true
source_order_may_not_substitute_for_global_grouping = true

[interval_policy]
names_and_shares_overlaps_are_fatal = true
inclusive_boundary_overlap_definition = "next_start <= maximum_prior_end within PERMNO"
contiguous_definition = "next_start = maximum_prior_end + one calendar day"
gaps_are_reported = true
gaps_are_fatal = false
intervals_starting_before_scope_must_be_retained_when_they_overlap = true
intervals_ending_after_scope_must_be_retained_when_they_overlap = true
current_stock_header_may_not_fill_interval_gaps = true

[categorical_policy]
compare_csv_decoded_strings_without_trim_case_or_null_normalization = true
blank_string_is_distinct = true
literal_n_slash_a_is_value = true
expected_domains_are_exact_sorted_distinct_nonblank_literals = true
unexpected_or_missing_nonblank_domain_value_is_fatal = true
frequency_reproduction_is_required = true

