[upstream.return_reconciliation]
verified_pointer = "artifacts/phase_02_canonical_panel/LATEST_CRSP_RETURN_RECONCILIATION_VERIFIED.json"
verified_pointer_sha256 = "136b84757cc40136fa621546c372592259d870b6440d70867a79e4c4364c4abb"
required_status = "verified_passed"
