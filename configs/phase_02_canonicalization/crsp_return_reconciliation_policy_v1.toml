return_history_policy = "not_usable_even_if_numeric"
event_ledger_exception = "a separately observed DelRet remains an event-ledger payoff candidate; this does not promote the MV daily payload"

[daily_return_flags.NA]
official_meaning = "not_applicable_not_missing"
classification = "observed_total_return_candidate"
numeric_value_policy = "required_in_domain"
