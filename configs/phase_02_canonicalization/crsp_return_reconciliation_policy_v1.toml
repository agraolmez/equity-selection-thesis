[authority]
primary_daily_total_return = "crsp_security_day_return_staging.raw_total_return"
daily_total_return_semantics = "CRSP CIZ total return including distributions and, when applicable, delisting outcomes"
daily_return_ex_distributions_semantics = "CRSP DlyRetx price appreciation without ordinary dividends, including CRSP price-factor treatment for splits and qualifying distributions"
