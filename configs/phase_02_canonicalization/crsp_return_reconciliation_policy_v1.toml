delisting_events_require_explicit_embedding_classification_before_any_adjustment = true
never_filter_on_future_outcome_availability = true

[arithmetic]
source_numeric_parse = "arbitrary_precision_decimal"
derived_reconciliation_type = "decimal128(38,12)"
binary_float_may_decide_a_canonical_value = false
default_numpy_isclose_permitted = false
return_domain_lower_bound = "-1.000000000000"
return_upper_bound = "unbounded"
compounding_formula = "product(1 + each nonoverlapping authoritative return) - 1"
overlapping_return_spans_may_not_be_compounded_twice = true

