classification = "delisting_event_required_missing_return"
numeric_value_policy = "unexpected_numeric_is_fatal_until_empirical_lock_says_otherwise"
return_history_policy = "not_usable_without_explicit_delisting_treatment"

[daily_return_flags.DM]
official_meaning = "delisting_price_or_amount_missing"
classification = "delisting_event_required_missing_return"
numeric_value_policy = "unexpected_numeric_is_fatal_until_empirical_lock_says_otherwise"
return_history_policy = "not_usable_without_explicit_delisting_treatment"

[daily_return_flags.DP]
official_meaning = "delisting_pending"
classification = "delisting_event_required_pending_return"
numeric_value_policy = "unexpected_numeric_is_fatal_until_empirical_lock_says_otherwise"
return_history_policy = "not_usable_without_explicit_delisting_treatment"

[daily_return_flags.GP]
official_meaning = "gap_between_prices_too_large"
classification = "missing_return_price_gap"
numeric_value_policy = "unexpected_numeric_is_fatal_until_empirical_lock_says_otherwise"
return_history_policy = "not_usable"

[daily_return_flags.MP]
