[daily_return_flags.NS]
official_meaning = "new_security"
classification = "missing_return_new_security"
numeric_value_policy = "unexpected_numeric_is_fatal_until_empirical_lock_says_otherwise"
return_history_policy = "not_usable"

[daily_return_flags.NT]
official_meaning = "not_tracked"
classification = "missing_return_not_tracked"
numeric_value_policy = "unexpected_numeric_is_fatal_until_empirical_lock_says_otherwise"
return_history_policy = "not_usable"

[daily_return_flags.RA]
