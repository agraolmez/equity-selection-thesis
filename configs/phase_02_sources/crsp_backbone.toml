[[sources]]
filename = "crsp_shares_outstanding_ciz.csv"
role = "effective-dated shares-outstanding history and ADR-share diagnostic"
grain = "security_shares_interval"
candidate_key = ["PERMNO", "ShrStartDt", "ShrEndDt"]
coverage_axis = "ShrStartDt"
availability_rule = "effective on the inclusive ShrStartDt through ShrEndDt interval"
calendar_owner = false
