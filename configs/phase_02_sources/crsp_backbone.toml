reconciliation_columns = ["DelDtPrc", "DelDtPrcFlg", "DelActionType", "DelStatusType", "DelReasonType", "DelPaymentType", "DelPERMNO", "DelPERMCO", "DelNextDt", "DelNextPrc", "DelNextPrcFlg", "DelAmtDt", "DelDivAmt", "DelDisType", "DelDlyDt", "PrimaryExch"]

[[vendor_fields]]
field = "DlyPrc"
unit = "usd_per_share"
definition = "last regular-session trade; bid-ask-average fallback when a trade price is unavailable"

[[vendor_fields]]
field = "DlyClose"
unit = "usd_per_share"
definition = "last regular-session trade only"

[[vendor_fields]]
field = "DlyCap"
unit = "thousand_usd"
definition = "daily market capitalization from DlyPrc times shares outstanding"

[[vendor_fields]]
field = "MthCap"
unit = "thousand_usd"
definition = "market capitalization on MthPrcDt"

[[vendor_fields]]
field = "ShrOut"
unit = "thousand_shares"
definition = "unadjusted or corporate-action-adjusted shares outstanding observation"

[[vendor_fields]]
field = "DlyVol"
unit = "shares"
definition = "raw shares traded during the day, not split-adjusted within month"

[[vendor_fields]]
field = "DlyPrcVol"
unit = "usd"
definition = "DlyPrc multiplied by DlyVol; a proxy, not transaction-level dollar volume"

[[vendor_fields]]
field = "DlyRet"
unit = "decimal_ratio"
definition = "daily total return"

[[vendor_fields]]
field = "MthRet"
unit = "decimal_ratio"
definition = "daily total returns compounded for the month, including delisting return when appropriate"

[[gates]]
gate_id = "CRSP_SCHEMA_EXACT"
stage = "contract_compile"
severity = "hard"
requirement = "all seven observed Phase 1 headers exactly equal this contract"

[[gates]]
gate_id = "PHASE_01_BOUNDARY_AUTHENTIC"
stage = "contract_compile"
severity = "hard"
requirement = "Phase 1 freeze and recovery attestation hashes and identifiers match"

[[gates]]
gate_id = "GLOBAL_DUPLICATE_CLASSIFICATION"
stage = "before_canonical_market_rows"
severity = "hard"
requirement = "full-key counts classify exact and conflicting duplicates; conflicting rows remain fatal"

[[gates]]
gate_id = "CRSP_UNIT_IDENTITIES"
stage = "before_universe_thresholds"
severity = "hard"
requirement = "documented units reconcile empirically for price-volume, price-shares-cap, and daily-monthly fields"

[[gates]]
gate_id = "RETURN_DISTRIBUTION_DELISTING_EXACTLY_ONCE"
stage = "before_labels"
severity = "hard"
requirement = "daily and monthly returns reconcile with distribution and delisting ledgers despite absent delisting flags"

[[gates]]
gate_id = "CALENDAR_BOUNDARIES_EXACT"
stage = "before_holding_intervals"
severity = "hard"
requirement = "derived signal, entry, exit, embargo, and full-feature cutoff dates equal Methodology v1"

[[gates]]
gate_id = "ADR_CAPITALIZATION_DIAGNOSTIC"
stage = "before_universe_thresholds"
severity = "hard"
requirement = "ShrAdrFlg and CRSP capitalization behavior are reported; no unsupported issuer-cap reconstruction"

[[gates]]
gate_id = "MONTHLY_OBSERVATION_DATE_VALID"
stage = "before_monthly_crosscheck"
severity = "hard"
requirement = "MthPrcDt, not MthCalDt alone, controls the market observation date; missing MthPrcDt is explicit"

[[gates]]
gate_id = "MARKET_OBSERVATION_VALIDITY_AND_FLAG_DOMAINS"
stage = "before_canonical_market_rows"
severity = "hard"
requirement = "finite-value rules and every used CRSP price, return, volume, and status flag domain are inventoried and tested"

[[gates]]
gate_id = "MISSING_EXECUTION_CLOSE_POLICY"
stage = "before_backtest_execution"
severity = "hard"
requirement = "a deterministic no-trade or fallback rule is frozen for a missing scheduled DlyClose"

[[gates]]
gate_id = "SOURCE_AUTHORITY_UNIQUE"
stage = "contract_compile"
severity = "hard"
requirement = "every output table has exactly one primary source and current-header fields are prohibited as historical sources"
