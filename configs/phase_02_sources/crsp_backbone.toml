[[sources]]
filename = "crsp_monthly_ciz.csv"
role = "monthly return and market-data cross-check; never the daily calendar owner"
grain = "security_month_information_interval_before_interval_selection"
candidate_key = ["PERMNO", "MthCalDt", "SecInfoStartDt", "SecInfoEndDt"]
coverage_axis = "MthCalDt"
availability_rule = "MthCalDt is the calendar-month axis; market data are dated by MthPrcDt and usable after that close"
calendar_owner = false
expected_columns = [
  "PERMNO", "SecInfoStartDt", "SecInfoEndDt", "HdrCUSIP", "CUSIP", "PrimaryExch",
  "ConditionalType", "ExchangeTier", "TradingStatusFlg", "USIncFlg", "IssuerType",
  "SecurityType", "SecuritySubType", "ShareType", "Ticker", "PERMCO", "SICCD", "NAICS",
  "ICBIndustry", "IssuerNm", "YYYYMM", "MthCalDt", "MthPrc", "MthPrcFlg", "MthPrcDt",
  "MthCap", "MthRet", "MthRetx", "MthRetFlg", "MthDisCnt", "MthVol", "MthVolFlg",
  "MthPrcVol", "MthFacShrFlg", "MthPrcVolMissCnt", "ShrOut",
]
stage_columns = [
  "PERMNO", "PERMCO", "SecInfoStartDt", "SecInfoEndDt", "CUSIP", "PrimaryExch",
  "ConditionalType", "TradingStatusFlg", "USIncFlg", "IssuerType", "SecurityType",
  "SecuritySubType", "ShareType", "SICCD", "YYYYMM", "MthCalDt", "MthPrc", "MthPrcFlg",
  "MthPrcDt", "MthCap", "MthRet", "MthRetx", "MthRetFlg", "MthDisCnt", "MthVol",
  "MthVolFlg", "MthPrcVol", "MthPrcVolMissCnt", "ShrOut",
]
identity_columns = ["PERMNO", "PERMCO", "CUSIP", "SecInfoStartDt", "SecInfoEndDt"]
date_columns = ["MthCalDt", "MthPrcDt"]
return_columns = ["MthRet", "MthRetx", "MthRetFlg"]
reconciliation_columns = ["MthPrc", "MthPrcDt", "MthCap", "MthDisCnt", "MthVol", "MthPrcVol", "MthPrcVolMissCnt", "ShrOut"]
expected_vendor_fields_absent_from_extract = ["MthDelFlg", "MthCapFlg", "MthCompFlg", "MthCompSubFlg", "MthDtFlg"]

[[sources]]
filename = "crsp_names_ciz.csv"
