stage_columns = ["PERMNO", "ShrStartDt", "ShrEndDt", "ShrOut", "ShrSource", "ShrFacType", "ShrAdrFlg"]
identity_columns = ["PERMNO", "ShrStartDt", "ShrEndDt"]
