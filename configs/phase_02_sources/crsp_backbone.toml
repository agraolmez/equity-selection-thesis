grain = "security_information_interval"
candidate_key = ["PERMNO", "SecInfoStartDt", "SecInfoEndDt"]
coverage_axis = "SecInfoStartDt"
availability_rule = "effective on the inclusive SecInfoStartDt through SecInfoEndDt interval"
calendar_owner = false
expected_columns = [
  "PERMNO", "HdrPrimaryExch", "NASDIssuno", "HdrSICCD", "PERMCO", "SecInfoStartDt",
  "SecInfoEndDt", "SecurityBegDt", "SecurityEndDt", "CUSIP", "Ticker", "IssuerNm", "ShareClass",
  "USIncFlg", "IssuerType", "SecurityType", "SecuritySubType", "ShareType", "SecurityActiveFlg",
  "SICCD", "PrimaryExch", "TradingSymbol", "NAICS", "TradingStatusFlg",
]
stage_columns = [
  "PERMNO", "PERMCO", "SecInfoStartDt", "SecInfoEndDt", "SecurityBegDt", "SecurityEndDt",
  "CUSIP", "Ticker", "IssuerNm", "USIncFlg", "IssuerType", "SecurityType", "SecuritySubType",
  "ShareType", "SICCD", "PrimaryExch", "NAICS", "TradingStatusFlg",
]
identity_columns = ["PERMNO", "PERMCO", "CUSIP", "SecInfoStartDt", "SecInfoEndDt"]
classification_columns = ["USIncFlg", "IssuerType", "SecurityType", "SecuritySubType", "ShareType", "SICCD", "NAICS", "PrimaryExch", "TradingStatusFlg"]

[[sources]]
filename = "crsp_stock_header_ciz.csv"
role = "current/reference security header used only for QA; never replaces effective-dated history"
grain = "security_header"
candidate_key = ["PERMNO"]
coverage_axis = "SecInfoStartDt"
availability_rule = "reference-only current header; prohibited as a historical as-of source"
calendar_owner = false
expected_columns = [
  "PERMNO", "SecInfoStartDt", "SecInfoEndDt", "SecurityBegDt", "SecurityEndDt", "SecurityHdrFlg",
  "HdrCUSIP", "HdrCUSIP9", "CUSIP", "CUSIP9", "PrimaryExch", "ConditionalType", "ExchangeTier",
  "TradingStatusFlg", "SecurityNm", "ShareClass", "USIncFlg", "IssuerType", "SecurityType",
  "SecuritySubType", "ShareType", "SecurityActiveFlg", "DelActionType", "DelStatusType",
  "DelReasonType", "DelPaymentType", "Ticker", "TradingSymbol", "PERMCO", "SICCD", "NAICS",
  "ICBIndustry", "UESIndustry", "NASDCompno", "NASDIssuno", "IssuerNm",
]
stage_columns = ["PERMNO", "PERMCO", "SecurityBegDt", "SecurityEndDt", "HdrCUSIP", "CUSIP", "SecurityHdrFlg"]
