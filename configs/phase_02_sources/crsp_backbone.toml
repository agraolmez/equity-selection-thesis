schema_version = 1
contract_name = "crsp_ciz_market_identity_backbone"
contract_version = "v1"
source_family = "CRSP CIZ"
authoritative_for = [
  "security_master",
  "historical_identifiers",
  "listing_and_trading_status",
  "prices_and_quotes",
  "total_returns",
  "volume_and_capitalization",
  "distributions",
  "shares_outstanding",
  "delistings",
]
official_documentation = "https://www.crsp.org/crsp_pdf/crsp-us-stock-indexes-databases-guide-flat-file-format-2-0/"
official_documentation_title = "CRSP US Stock & Indexes Databases Guide, Flat File Format 2.0 (CIZ)"
official_documentation_last_modified = "2026-04-27"
phase_01_raw_contract = "configs/raw_contracts/crsp.toml"

[scope]
first_slice = "development_only_2000_01_01_through_2014_12_31"
contract_compilation_reads_raw_rows = false
calendar_build_may_read_only = ["crsp_daily_ciz.csv:DlyCalDt"]
backbone_build_may_read_final_test_outcomes = false
targets_features_and_portfolios_prohibited = true

[[outputs]]
table = "trading_calendar"
candidate_key = ["calendar_date"]
primary_source = "crsp_daily_ciz.csv"
status_after_contract_compile = "defined_not_built"
allowed_first_slice = true

[[outputs]]
table = "rebalance_calendar"
candidate_key = ["holding_month"]
primary_source = "trading_calendar"
status_after_contract_compile = "defined_not_built"
allowed_first_slice = true

[[outputs]]
table = "crsp_security_day"
candidate_key = ["PERMNO", "calendar_date"]
primary_source = "crsp_daily_ciz.csv"
status_after_contract_compile = "blocked_pending_duplicate_unit_flag_and_validity_gates"
allowed_first_slice = true

[[outputs]]
table = "crsp_security_month_crosscheck"
candidate_key = ["PERMNO", "calendar_month"]
primary_source = "crsp_monthly_ciz.csv"
status_after_contract_compile = "blocked_pending_duplicate_and_observation_date_gates"
allowed_first_slice = true

[[outputs]]
table = "crsp_identity_interval"
candidate_key = ["PERMNO", "start_date", "end_date"]
primary_source = "crsp_names_ciz.csv"
status_after_contract_compile = "defined_not_built"
allowed_first_slice = true

[[outputs]]
table = "crsp_shares_interval"
candidate_key = ["PERMNO", "start_date", "end_date"]
primary_source = "crsp_shares_outstanding_ciz.csv"
status_after_contract_compile = "defined_not_built"
allowed_first_slice = true

[[outputs]]
table = "crsp_distribution_event"
candidate_key = ["PERMNO", "ex_date", "sequence_number"]
primary_source = "crsp_distribution_ciz.csv"
status_after_contract_compile = "reconciliation_only_not_built"
allowed_first_slice = true

[[outputs]]
table = "crsp_delisting_event"
candidate_key = ["PERMNO", "delisting_date"]
primary_source = "crsp_delisting_ciz.csv"
status_after_contract_compile = "reconciliation_only_not_built"
allowed_first_slice = true

[[sources]]
filename = "crsp_daily_ciz.csv"
role = "authoritative security-day market, eligibility, return, and quote backbone"
grain = "security_day_before_duplicate_resolution"
candidate_key = ["PERMNO", "DlyCalDt"]
coverage_axis = "DlyCalDt"
availability_rule = "usable only after DlyCalDt close"
calendar_owner = true
expected_columns = [
  "PERMNO", "SecInfoStartDt", "SecInfoEndDt", "HdrCUSIP", "CUSIP", "PrimaryExch",
  "ConditionalType", "ExchangeTier", "TradingStatusFlg", "USIncFlg", "IssuerType",
  "SecurityType", "SecuritySubType", "ShareType", "Ticker", "PERMCO", "SICCD", "NAICS",
  "ICBIndustry", "IssuerNm", "DlyCalDt", "DlyPrc", "DlyPrcFlg", "DlyCap", "DlyRet",
  "DlyRetx", "DlyRetMissFlg", "DlyRetDurFlg", "DlyVol", "DlyClose", "DlyLow", "DlyHigh",
  "DlyBid", "DlyAsk", "DlyOpen", "DlyPrcVol",
]
stage_columns = [
  "PERMNO", "PERMCO", "SecInfoStartDt", "SecInfoEndDt", "CUSIP", "PrimaryExch",
  "ConditionalType", "TradingStatusFlg", "USIncFlg", "IssuerType", "SecurityType",
  "SecuritySubType", "ShareType", "Ticker", "SICCD", "NAICS", "ICBIndustry", "DlyCalDt",
  "DlyPrc", "DlyPrcFlg", "DlyCap", "DlyRet", "DlyRetx", "DlyRetMissFlg", "DlyRetDurFlg",
  "DlyVol", "DlyClose", "DlyLow", "DlyHigh", "DlyBid", "DlyAsk", "DlyOpen", "DlyPrcVol",
]
